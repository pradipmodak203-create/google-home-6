  /* --- ফাইল ইনপুট (ওয়ালপেপার আপলোড) --- */
  const fileInput = h('input', { type: 'file', accept: 'image/*' });
  fileInput.style.display = 'none';
  function encodeWall(img) {
    for (const [max, q] of [[1280, 0.8], [1000, 0.75], [800, 0.7]]) {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', q);
      if (saveVal('hs_wall', d)) return d;
    }
    return null;
  }
  // forceAuto: নিজে ওয়ালপেপার বদলালে থিম আবার ওয়ালপেপার থেকে অটো নেওয়া হবে (আগে হাতে রঙ বাছা থাকলেও)
  function ingestImage(src, done, cors, forceAuto) {
    const img = new Image();
    if (cors) img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const w = encodeWall(img);
        if (!w) { if (done) done(false); return; }
        WALL = w;
        if (S.autoTheme || forceAuto) { S.autoTheme = true; S.color = ''; const [hh, ss] = dominantColor(img); S.hue = hh; S.sat = ss; }
      } catch (e) { if (done) done(false); return; }
      S.wallUrl = '';
      save();
      applyWallpaper();
      applyTheme();
      if (done) done(true);
    };
    img.onerror = () => { if (done) done(false); };
    img.src = src;
  }
  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => ingestImage(fr.result, () => closeSheet(), false, true);
    fr.readAsDataURL(f);
    fileInput.value = '';
  });

  /* ---------- Refresh daily (Bing image of the day) ---------- */
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  async function getBingUrl() {
    try {
      const r = await netFetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=en-US', 'text', (x) => /"images"/.test(x.responseText));
      return 'https://www.bing.com' + JSON.parse(r.responseText).images[0].urlbase + '_1080x1920.jpg';
    } catch (e) { /* পরের উৎস */ }
    try {
      const r = await netFetch('https://bing.biturl.top/?format=json&index=0&mkt=en-US', 'text', (x) => /"url"/.test(x.responseText));
      return JSON.parse(r.responseText).url || null;
    } catch (e) { return null; }
  }
  function refreshDaily(force) {
    if (!S.daily) return;
    const t = todayKey();
    if (!force && S.lastRefresh === t) return;
    getBingUrl().then(async (url) => {
      if (!url) return;
      const done = () => { S.lastRefresh = t; save(); };
      // ১) সরাসরি (CORS অনুমোদিত হলে ক্যানভাসে পড়া যায়)
      if (await new Promise((res) => ingestImage(url, res, true))) return done();
      // ২) প্রক্সি দিয়ে ছবির ডেটা এনে
      try {
        const r = await netFetch(url, 'blob', (x) => x.response && x.response.size > 2000);
        const d = await blobToDataURL(r.response);
        if (await new Promise((res) => ingestImage(d, res))) return done();
      } catch (e) { /* ৩ নং ধাপ */ }
      // ৩) শেষ ভরসা: ছবির URL সরাসরি ব্যাকগ্রাউন্ড হিসেবে (থিম রঙ বদলাবে না)
      WALL = null; saveVal('hs_wall', null);
      S.wallUrl = url;
      save(); applyWallpaper(); applyTheme();
      done();
    });
  }

  const PALETTE = [
    ['#3b5f9a', '#c5cae0', '#e1e1ec'], ['#046b61', '#b3cfcb', '#d9e3e1'], ['#3d6b31', '#c5cdbc', '#e0e3da'],

    ['#934656', '#e0c1c6', '#eddddf'], ['#864b7f', '#dbc3d6', '#ecdce3'], ['#6e5392', '#d4c8dc', '#e8dfe8'],
  ];
  // ডিফল্ট লুক (Chrome-এর হালকা নীলচে থিম): ব্যাকগ্রাউন্ড হালকা নীল, সার্চ বার তার চেয়ে গাঢ় নীল, শর্টকাট/ফিড কার্ড সাদা
  const DEF_LOOK = { h: 226, s: 52, bg: '#e7eaf7', search: '#c5d1ef', circle: '#eaeefb', sheet: '#f6f7fd' };
  function applyTheme() {
    const light = !(WALL || S.wallUrl) && !!S.autoTheme; // ওয়ালপেপার নেই + অটো থিম = ডিফল্ট লুক
    const hh = light ? DEF_LOOK.h : S.hue;
    const s = light ? DEF_LOOK.s : clamp(S.sat, S.autoTheme ? 35 : 0, 75);
    host.classList.toggle('lightbg', light);
    const st = host.style;
    const g1 = light ? DEF_LOOK.bg : `hsl(${hh},${Math.round(s * 0.6)}%,38%)`;
    const g2 = light ? DEF_LOOK.bg : `hsl(${hh},${Math.min(100, s + 25)}%,70%)`;
    st.setProperty('--outline', `hsl(${hh},8%,50%)`);
    st.setProperty('--card', light ? '#ffffff' : `hsla(${hh},${s}%,97%,.94)`);
    st.setProperty('--circle', light ? DEF_LOOK.circle : `hsl(${hh},${s}%,92%)`);
    st.setProperty('--bar', light ? DEF_LOOK.circle : `hsl(${hh},${s}%,93%)`);
    st.setProperty('--sheet', light ? DEF_LOOK.sheet : `hsl(${hh},${s}%,97%)`);
    st.setProperty('--text', light ? '#44474f' : `hsl(${hh},14%,27%)`);
    st.setProperty('--ink', light ? '#1b1c2b' : `hsl(${hh},25%,16%)`);
    st.setProperty('--accent', `hsl(${hh},${s}%,38%)`);
    st.setProperty('--g1', g1);
    st.setProperty('--g2', g2);
    // সার্চ বার ও AI Mode/Incognito ক্যাপসুল থিমের সাথে বদলায়:
    //  ডিফল্ট = নীলচে; প্যালেট-সোয়াচ = ওই সোয়াচের tonal রঙ; অটো/কাস্টম = hue থেকে হালকা টোন
    let searchCol = DEF_LOOK.search;
    if (!light) {
      const pe = !S.autoTheme && PALETTE.find((q) => q[0] === S.color);
      searchCol = pe ? pe[1] : `hsl(${hh},${Math.round(clamp(s, 20, 60) * 0.9)}%,84%)`;
    }
    st.setProperty('--search', searchCol);
    try { setMeta(light ? DEF_LOOK.bg : `hsl(${hh},${s}%,93%)`); } catch (e) { /* ignore */ }
    try { localStorage.setItem('hs_bg', light ? DEF_LOOK.bg : `linear-gradient(180deg,${g1} 0%,${g2} 100%)`); } catch (e) { /* ignore */ }
  }

  // RSS ঠিকানা কাজ না করলে সাইটের হোমপেজ থেকে খবরের লিংক/শিরোনাম/ছবি তুলে আনা হয়; তাও না হলে Google News।
  const FEED_TTL = 5 * 60 * 1000; // ১৫ মিনিটের পুরনো হলে নতুন করে আনবে
  const PER_SOURCE = 7;
  let FEED = [], FEED_T = 0, feedBusy = false;

  function decodeHtml(str) {
    const d = new DOMParser().parseFromString(str || '', 'text/html');
    return (d.documentElement.textContent || '').trim();
  }
  function parseFeed(xml, src, gnews) {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) return [];
    let nodes = Array.from(doc.getElementsByTagName('item'));
    if (!nodes.length) nodes = Array.from(doc.getElementsByTagName('entry'));
    const txt = (n, tag) => { const e = n.getElementsByTagName(tag)[0]; return e ? (e.textContent || '').trim() : ''; };
    const out = [];
    nodes.slice(0, 25).forEach((n) => {
      let title = decodeHtml(txt(n, 'title'));
      let link = txt(n, 'link');
      if (!link) { const l = n.getElementsByTagName('link')[0]; link = l ? l.getAttribute('href') || '' : ''; }
      if (!title || !link) return;
      if (gnews) title = title.replace(/\s+-\s+[^-]+$/, '');
      const d = Date.parse(txt(n, 'pubDate') || txt(n, 'dc:date') || txt(n, 'published') || txt(n, 'updated')) || 0;
      let img = '';
      const mc = n.getElementsByTagName('media:content')[0] || n.getElementsByTagName('media:thumbnail')[0];
      if (mc) img = mc.getAttribute('url') || '';
      if (!img) {
        const en = n.getElementsByTagName('enclosure')[0];
        if (en && /image/.test(en.getAttribute('type') || 'image')) img = en.getAttribute('url') || '';
      }
      if (!img) {
        const m = /<img[^>]+src=["']([^"']+)/i.exec(txt(n, 'content:encoded') || txt(n, 'description'));
        if (m) img = m[1];
      }
      try { if (img) img = new URL(img.replace(/&amp;/g, '&'), link).href; } catch (e) { img = ''; }
      out.push({ t: title, l: link, d, i: img, s: src.id, sn: src.name, dom: src.domain });
    });
    return out;
  }
  function scrapeItems(html, baseUrl, src) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const norm = (x) => x.replace(/^www\./, '');
    let baseHost = '';
    try { baseHost = norm(new URL(baseUrl).hostname); } catch (e) { return []; }
    const bad = /\/(tag|tags|category|categories|author|authors|topic|topics|page|videos?|photos?|gallery|live-tv|about|contact|privacy|terms|advertise|search|login|epaper)(\/|$)/i;
    const pickImg = (el) => {
      const im = el && el.querySelector('img');
      if (!im) return '';
      const cand = im.getAttribute('data-src') || im.getAttribute('data-lazy-src') || im.getAttribute('data-original')
        || (im.getAttribute('srcset') || '').split(',')[0].trim().split(' ')[0] || im.getAttribute('src') || '';
      if (!cand || cand.startsWith('data:')) return '';
      try { return new URL(cand, baseUrl).href; } catch (e) { return ''; }
    };
    const seenL = new Set(), seenT = new Set(), out = [];
    for (const a of doc.querySelectorAll('a[href]')) {
      if (out.length >= 25) break;
      let u;
      try { u = new URL(a.getAttribute('href'), baseUrl); } catch (e) { continue; }
      if (!/^https?:$/.test(u.protocol) || norm(u.hostname) !== baseHost) continue;
      if (src.scope && !u.pathname.startsWith(src.scope)) continue;
      if (u.pathname.length < 15 || bad.test(u.pathname)) continue;
      u.hash = '';
      const link = u.href;
      let title = (a.getAttribute('title') || a.getAttribute('aria-label') || a.textContent || '').replace(/\s+/g, ' ').trim();
      if (!title) { const im = a.querySelector('img'); title = im ? (im.getAttribute('alt') || '').trim() : ''; }
      if (title.length < 18 || title.length > 220 || seenL.has(link) || seenT.has(title)) continue;
      seenL.add(link); seenT.add(title);
      let img = pickImg(a);
      if (!img && a.parentElement && a.parentElement.querySelectorAll('a').length <= 3) img = pickImg(a.parentElement);
      out.push({ t: title, l: link, d: 0, i: img, s: src.id, sn: src.name, dom: src.domain });
    }
    return out;
  }
  async function fetchSource(src) {
    const isFeed = (x) => /<(rss|feed|rdf:RDF)/i.test(x.responseText.slice(0, 4000));
    const isHtml = (x) => /<(html|head|body)/i.test(x.responseText.slice(0, 5000));
    const parse = (r, g) => { const it = parseFeed(r.responseText, src, g); if (!it.length) throw new Error('empty'); return it; };
    const fromUrl = (u) => netFetch(u, 'text', isFeed).then((r) => parse(r, false));
    const scrape = () => netFetch(src.home, 'text', isHtml).then((r) => {
      const it = scrapeItems(r.responseText, r.finalUrl || src.home, src);
      if (it.length < 3) throw new Error('empty');
      return it;
    });
    const gnews = () => netFetch('https://news.google.com/rss/search?q=' + encodeURIComponent(src.gq + ' when:2d') + '&hl=bn&gl=IN&ceid=IN:bn', 'text', isFeed).then((r) => parse(r, true));
    return new Promise((resolve) => {
      let settled = false, bStarted = false, gStarted = false, aFail = false, bFail = false, gFail = false, timer;
      const fin = (v) => { if (!settled) { settled = true; clearTimeout(timer); resolve(v); } };
      const maybeEnd = () => { if (aFail && bFail && gFail) fin([]); };
      const startG = () => {
        if (gStarted || settled) return;
        gStarted = true;
        gnews().then(fin, () => { gFail = true; maybeEnd(); });
      };
      const startB = () => {
        if (bStarted || settled) return;
        bStarted = true;
        if (!src.home) { bFail = true; startG(); return; }
        scrape().then(fin, () => { bFail = true; startG(); maybeEnd(); });
      };
      // ১) RSS ঠিকানাগুলো একসাথে  ২) ৩.৫ সেকেন্ডে না এলে/ব্যর্থ হলে হোমপেজ থেকে  ৩) তাও না হলে Google News
      firstOk(src.urls.map(fromUrl)).then(fin, () => { aFail = true; startB(); maybeEnd(); });
      timer = setTimeout(startB, 3500);
      setTimeout(() => fin([]), 25000);
    });
  }
  async function fillImages(items) {
    const todo = items.filter((it) => !it.i && !it.tried && !/news\.google\.com/.test(it.l)).slice(0, 24);
    let idx = 0, timer;
    const flush = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (items === FEED) { saveVal('hs_feed', { t: FEED_T, items: FEED }); renderFeed(); }
      }, 500);
    };
    const worker = async () => {
      while (idx < todo.length) {
        const it = todo[idx++];
        it.tried = true;
        try {
          const r = await netFetch(it.l, 'text', (x) => /<(html|head|meta)/i.test(x.responseText.slice(0, 5000)));
          const html = r.responseText;
          const m = /<meta[^>]+property=["']og:image["'][^>]*content=["']([^"']+)["']/i.exec(html)
            || /<meta[^>]+content=["']([^"']+)["'][^>]*property=["']og:image["']/i.exec(html);
          if (m) { it.i = new URL(m[1].replace(/&amp;/g, '&'), r.finalUrl || it.l).href; flush(); }
        } catch (e) { /* ignore */ }
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
  }
  async function refreshFeed(force) {
    if (feedBusy) return;
    if (!force && FEED.length && Date.now() - FEED_T < FEED_TTL) return;
    feedBusy = true;
    const old = FEED.slice();
    const lists = FEEDS.map(() => null);
    let any = false;
    const merge = () => {
      const ls = FEEDS.map((f, i) => {
        const l = (lists[i] || old.filter((x) => x.s === f.id)).slice();
        l.sort((a, b) => b.d - a.d);
        return l;
      });
      const seen = new Set(), items = [];
      for (let i = 0; i < PER_SOURCE; i++) {
        ls.forEach((l) => { const it = l[i]; if (it && !seen.has(it.l)) { seen.add(it.l); items.push(it); } });
      }
      return items;
    };
    try {
      // প্রতিটি সোর্স আসামাত্র দেখানো হবে (সবার জন্য অপেক্ষা নয়)
      await Promise.all(FEEDS.map(async (f, i) => {
        const items = await fetchSource(f).catch(() => []);
        if (!items.length) return;
        items.forEach((it) => { if (!it.i) { const o = old.find((x) => x.l === it.l); if (o && o.i) it.i = o.i; } });
        lists[i] = items;
        any = true;
        FEED = merge();
        FEED_T = Date.now();
        saveVal('hs_feed', { t: FEED_T, items: FEED });
        renderFeed();
      }));
      if (!any && !FEED.length) renderFeed(true);
      fillImages(FEED);
    } finally { feedBusy = false; }
  }
  function ago(ms) {
    const m = Math.max(1, Math.round((Date.now() - ms) / 60000));
    if (m < 60) return m + 'm';
    const hr = Math.round(m / 60);
    return hr < 24 ? hr + 'h' : Math.round(hr / 24) + 'd';
  }
  function feedImg(url, cls) {
    const img = h('img', { class: cls, src: url, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', draggable: 'false' });
    let tried = false;
    img.addEventListener('error', () => {
      if (tried) { img.style.display = 'none'; return; }
      tried = true;
      netFetch(url, 'blob').then((r) => blobToDataURL(r.response)).then((d) => { img.src = d; }).catch(() => { img.style.display = 'none'; });
    });
    return img;
  }
  function shareItem(it) {
    if (navigator.share) { navigator.share({ title: it.t, url: it.l }).catch(() => {}); return; }
    try { navigator.clipboard.writeText(it.l); } catch (e) { /* ignore */ }
  }
  function openFeedMenu(it) {
    openSheet('Story',
      h('div', { class: 'row' },
        h('button', { class: 'btn', text: 'Open', onclick: () => { location.href = it.l; } }),
        h('button', { class: 'btn ghost', text: 'Copy link', onclick: () => { try { navigator.clipboard.writeText(it.l); } catch (e) { /* ignore */ } closeSheet(); } }),
        h('button', {
          class: 'btn ghost', text: 'Hide story', onclick: () => {
            S.hidden = (S.hidden || []).concat(it.l).slice(-300);
            save(); renderFeed(); closeSheet();
          },
        })));
  }
  function renderFeed(err) {
    feedEl.replaceChildren();
    const hidden = S.hidden || [];
    const list = FEED.filter((x) => !hidden.includes(x.l));
    if (!list.length) {
      const msg = h('div', { class: 'fmsg', text: err ? "Couldn't load news. Tap to retry." : 'Loading news…' });
      if (err) msg.addEventListener('click', () => { msg.textContent = 'Loading news…'; refreshFeed(true); });
      feedEl.append(msg);
      return;
    }
    list.forEach((it, i) => {
      const fav = h('img', { class: 'fav', src: 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(it.dom), alt: '' });
      fav.addEventListener('error', () => { fav.style.visibility = 'hidden'; });
      const shareBtn = h('button', { class: 'fbtn', 'aria-label': 'Share', onclick: (e) => { e.stopPropagation(); shareItem(it); } }, svg(ICON.share, '', '0 0 24 24'));
      const moreBtn = h('button', { class: 'fbtn', 'aria-label': 'More', onclick: (e) => { e.stopPropagation(); openFeedMenu(it); } }, svg(ICON.more));
      const meta = h('div', { class: 'fmeta' }, fav, h('span', { class: 'fsrc', text: it.sn }),
        it.d ? h('span', { text: '· ' + ago(it.d) }) : null, h('span', { class: 'fgap' }), shareBtn, moreBtn);
      const big = it.i && i % 3 !== 0;
      const row = big
        ? [feedImg(it.i, 'fimg'), h('div', { class: 'ft fbt', text: it.t }), meta]
        : [h('div', { class: 'fa' }, h('div', { class: 'ft', text: it.t }), it.i ? feedImg(it.i, 'fthumb') : null), meta];
      const el = h('div', { class: 'fi', role: 'link' }, row);
      el.addEventListener('click', () => { location.href = it.l; });
      feedEl.append(el);
    });
  }

  /* ---------- Mount ---------- */
  root.append(wall, page, topBar, menuScrim, menu, scrim, fileInput);
  host.style.setProperty('visibility', 'visible', 'important');
  document.body.appendChild(host);
  renderTiles();
  applyWallpaper();
  applyTheme();
  try {
    const fc = loadVal('hs_feed', null);
    if (fc && Array.isArray(fc.items)) { FEED = fc.items; FEED_T = fc.t || 0; }
  } catch (e) { /* ignore */ }
  renderFeed();
  // নেটওয়ার্কের কাজ প্রথম ফ্রেম আঁকার পরে
  (window.requestIdleCallback || ((f) => setTimeout(f, 60)))(() => { refreshDaily(false); refreshFeed(false); });
  setInterval(() => refreshFeed(false), 2 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFeed(false); });
  // পুরনো (সম্ভবত ঝাপসা) সংরক্ষিত আইকন একবার নতুন নিয়মে আবার বাছাই
  S.shortcuts.forEach((x) => { if (x.iconV !== 2) { delete x.icon; fetchIcon(x); } });
})();
</script>
